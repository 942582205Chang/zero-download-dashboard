<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布15天后 0 下载 · 资源明细</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f2f2f7; --surface: rgba(255,255,255,0.82); --surface-solid: #fff;
    --separator: rgba(120,120,128,0.16); --ink: #1c1c1e; --ink-2: #3a3a3c;
    --muted: #8e8e93; --grid: #e5e5ea; --blue: #007aff; --red: #ff3b30;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.08);
    --shadow-md: 0 4px 12px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.06);
    --shadow-lg: 0 12px 28px rgba(0,0,0,.08), 0 4px 10px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --surface:rgba(28,28,30,.72); --surface-solid:#1c1c1e;
      --separator:rgba(84,84,88,.36); --ink:#fff; --ink-2:#ebebf0; --muted:#8e8e93;
      --grid:#38383a; --blue:#0a84ff; --red:#ff453a; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45; }
  .overlay { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  .login-box { background: var(--surface); border: 1px solid var(--separator); border-radius: 28px; padding: 44px 40px; width: 380px; box-shadow: var(--shadow-lg); }
  .login-box h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .login-box p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .login-box label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-top: 16px; }
  .login-box input { width: 100%; padding: 12px 14px; font-size: 16px; margin-top: 6px; border: 1px solid var(--separator); border-radius: 12px; background: var(--surface-solid); color: var(--ink); outline: none; }
  .login-box button { width: 100%; margin-top: 28px; padding: 14px; font-size: 16px; font-weight: 700; border: none; border-radius: 14px; background: var(--blue); color: #fff; cursor: pointer; }
  .login-box .err { color: var(--red); font-size: 13px; margin-top: 14px; min-height: 18px; }
  .page { max-width: 1600px; margin: 0 auto; padding: 24px 28px 40px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .brand p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--separator); color: var(--ink-2); font-size: 13px; font-weight: 600; }
  .back { cursor: pointer; color: var(--blue); font-weight: 700; font-size: 13px; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--separator); text-decoration: none; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  .search { flex: 1; min-width: 260px; padding: 10px 14px; font-size: 15px; border: 1px solid var(--separator); border-radius: 12px; background: var(--surface-solid); color: var(--ink); outline: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; }
  .filters select, .filters input[type=number] { padding: 9px 10px; font-size: 14px; border: 1px solid var(--separator); border-radius: 10px; background: var(--surface-solid); color: var(--ink); outline: none; }
  .filters label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; min-height: 8px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--blue); color: #fff; font-size: 13px; font-weight: 600; }
  .tag.clear-all { background: var(--red); cursor: pointer; }
  .tag.clear-all.disabled { background: var(--separator); color: var(--muted); cursor: not-allowed; }
  .tag button { background: none; border: none; color: #fff; font-size: 14px; cursor: pointer; line-height: 1; padding: 0; }
  .table-wrap { background: var(--surface); border: 1px solid var(--separator); border-radius: 16px; box-shadow: var(--shadow-md); overflow: auto; max-height: 70vh; }
  table { border-collapse: separate; border-spacing: 0; font-size: 13px; width: 100%; min-width: 2000px; }
  thead th { position: sticky; top: 0; z-index: 2; background: #FFFBE6; color: var(--ink); font-weight: 700; font-size: 13px; padding: 9px 10px; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--separator); }
  thead th:hover { background: #FFF3B0; }
  thead th .arr { color: var(--blue); margin-left: 3px; }
  tbody td { padding: 7px 10px; border-bottom: 1px solid var(--separator); white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  tbody tr:hover td { background: rgba(0,122,255,0.04); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .pager { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .pager .info { color: var(--muted); font-size: 14px; }
  .pager button, .ios-btn { padding: 10px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; background: var(--blue); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager button.ghost { background: var(--surface); color: var(--blue); border: 1px solid var(--separator); }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-size: 15px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .bar .count { color: var(--muted); font-size: 14px; }
  .bar .count b { color: var(--ink); }
</style>
</head>
<body>

<div class="overlay" id="loginOverlay">
  <div class="login-box">
    <h2>🔒 0下载明细</h2>
    <p>请输入账号密码查看明细</p>
    <label for="loginUser">账号</label>
    <input id="loginUser" type="text" autocomplete="username" placeholder="账号">
    <label for="loginPass">密码</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="密码">
    <button id="loginBtn">登 录</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div class="page" id="page">
  <header>
    <div class="brand">
      <h1>发布15天后 0 下载 · 资源明细</h1>
      <p>支持搜索 / 筛选 / 排序 / 分页，敏感字段登录后明文展示（数据维度：小初高委托创作2026-2027学年发布15天后前台下载次数为 0 的资源）</p>
    </div>
    <div class="meta">
      <span class="badge" id="timeBadge">更新：--</span>
      <button class="ios-btn" id="exportBtn" style="display:none;">⬇ 导出 Excel</button>
      <a class="back" href="index.html">← 返回看板</a>
      <span class="back" id="logoutBtn" style="display:none;cursor:pointer;">退出登录</span>
    </div>
  </header>

  <div class="toolbar">
    <input class="search" id="searchInput" placeholder="🔍 搜索标题 / 资源id / 链接 / 专辑…">
    <div class="filters" id="filters"></div>
  </div>
  <div class="tags" id="filterTags"></div>
  <div class="bar">
    <div class="count">共 <b id="totalCount">--</b> 条 | 当前显示第 <b id="pageInfo">-</b> 页</div>
    <div class="pager">
      <button class="ghost" id="prevBtn" disabled>← 上一页</button>
      <button class="ghost" id="nextBtn" disabled>下一页 →</button>
      <select id="perPage" class="ghost" style="padding:9px 10px;border-radius:10px;border:1px solid var(--separator);background:var(--surface-solid);color:var(--ink);">
        <option value="50">50 条/页</option>
        <option value="100">100 条/页</option>
        <option value="200">200 条/页</option>
      </select>
    </div>
  </div>
  <div class="table-wrap" id="tableWrap">
    <div class="loading" id="loading">数据加载中…</div>
    <table id="detailTable" style="display:none;">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
// ===== 登录 =====
const AUTH_KEY = 'dash_auth_2026';
const PWD_HASH = '0bbb34c02cd52aef24f5bf48ac09b384178586555a3ea52f19c8b853d180454b';
const SENS_KEY = 'xkw-0dl-2026';
const SENS_FIELDS = ['审核人','审核时间','用户名','作者id','提成比例','定价','店铺'];
async function sha256hex(str) {
  const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function decSens(s) {
  if (!s) return s;
  try {
    const raw = atob(s);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i) ^ SENS_KEY.charCodeAt(i % SENS_KEY.length);
    return new TextDecoder('utf-8').decode(bytes);
  } catch (e) { return s; }
}
function lock() { document.getElementById('loginOverlay').style.display = 'flex'; }
function logout() { localStorage.removeItem(AUTH_KEY); lock(); }
function unlock() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'inline-flex';
  loadData();
}
async function handleLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  if (!u || !p) { err.textContent = '请输入账号和密码'; return; }
  if (await sha256hex(u + ':' + p) === PWD_HASH) { localStorage.setItem(AUTH_KEY, '1'); unlock(); }
  else err.textContent = '账号或密码错误';
}
if (localStorage.getItem(AUTH_KEY) === '1') unlock(); else lock();
document.getElementById('loginBtn').addEventListener('click', handleLogin);
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
document.getElementById('logoutBtn').addEventListener('click', logout);

// ===== 列定义（发布天数在审核人前）=====
const COLS = ['课程','资源id','标题','场景','类型','品牌','年级','版本','b端下载','c端消费','前台下载','发布天数','审核人','审核时间','学年','年份','学期','地区','等级_状态','作者id','用户名','店铺','提成比例','定价','链接','所属专辑','专辑名称'];
const NUM_COLS = new Set(['b端下载','c端消费','前台下载','发布天数','年份','作者id','资源id']);
const FILTER_COLS = ['课程','品牌','年级','版本','地区'];   // 下拉筛选列（品牌紧随课程，年级在版本前）
const DISPLAY_COLS = COLS.filter(c => c !== '链接');   // 页面展示列：链接列移除，资源id变超链接（导出仍用 COLS 含链接）

let allDetail = [], filtered = [];
const state = {
  search: '', filter: {}, daysMin: '', daysMax: '',
  sortCol: null, sortDir: 1,   // null = 默认多级排序
  page: 1, per: 50
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function defaultCmp(a, b) {
  // 默认：课程 → 版本 → 发布天数 升序
  let v = String(a['课程']||'').localeCompare(String(b['课程']||''), 'zh-CN');
  if (v) return v;
  v = String(a['版本']||'').localeCompare(String(b['版本']||''), 'zh-CN');
  if (v) return v;
  return (Number(a['发布天数'])||0) - (Number(b['发布天数'])||0);
}
function colCmp(a, b, col, dir) {
  const va = a[col], vb = b[col];
  let v;
  if (NUM_COLS.has(col)) v = (Number(va)||0) - (Number(vb)||0);
  else v = String(va||'').localeCompare(String(vb||''), 'zh-CN');
  return v * dir;
}
function comparator(a, b) {
  if (state.sortCol) {
    const v = colCmp(a, b, state.sortCol, state.sortDir);
    return v || defaultCmp(a, b);   // 同值回退到默认排序
  }
  return defaultCmp(a, b);
}

function matches(r) {
  const s = state.search.toLowerCase();
  if (s) {
    const hay = [r['标题'], r['资源id'], r['链接'], r['所属专辑'], r['专辑名称'], r['课程'], r['品牌'], r['地区'], r['版本']].map(x => String(x||'').toLowerCase()).join(' ');
    if (!hay.includes(s)) return false;
  }
  for (const col of FILTER_COLS) {
    const want = state.filter[col];
    if (want && String(r[col]||'') !== want) return false;
  }
  const d = Number(r['发布天数'])||0;
  if (state.daysMin !== '' && d < Number(state.daysMin)) return false;
  if (state.daysMax !== '' && d > Number(state.daysMax)) return false;
  return true;
}

function apply() {
  filtered = allDetail.filter(matches).sort(comparator);
  renderTags();
  render();
}

// 筛选下拉选项排序：课程 小学→初中→高中→其他，各学段内按 语文/数学/英语/物理/化学/生物/政治道法/历史/地理/科学，最后其它；年级 一年级…九年级→高一高二高三→未打标
const GRADE_ORDER = ['一年级','二年级','三年级','四年级','五年级','六年级','七年级','八年级','九年级','高一','高二','高三','未打标'];
const SUBJECT_GROUPS = [['语文'],['数学'],['英语'],['物理'],['化学'],['生物'],['政治','道法'],['历史'],['地理'],['科学']];
function stageRank(c) { return c.startsWith('小学') ? 0 : c.startsWith('初中') ? 1 : c.startsWith('高中') ? 2 : 3; }
function gradeIdx(g) { const i = GRADE_ORDER.indexOf(String(g)); return i < 0 ? GRADE_ORDER.length : i; }
function subjectIdx(course) {
  const sub = String(course).replace(/^(小学|初中|高中|中职|其他)/, '');
  for (let i = 0; i < SUBJECT_GROUPS.length; i++) {
    if (SUBJECT_GROUPS[i].some(s => sub.includes(s))) return i;
  }
  return SUBJECT_GROUPS.length;
}
function sortFilterOptions(col, vals) {
  if (col === '课程') return vals.sort((a, b) => stageRank(String(a)) - stageRank(String(b)) || subjectIdx(String(a)) - subjectIdx(String(b)) || String(a).localeCompare(String(b), 'zh-CN'));
  if (col === '年级') return vals.sort((a, b) => gradeIdx(a) - gradeIdx(b) || String(a).localeCompare(String(b), 'zh-CN'));
  return vals.sort((a, b) => String(a).localeCompare(String(b), 'zh-CN'));
}

function buildFilterOptions() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  FILTER_COLS.forEach(col => {
    const vals = [...new Set(allDetail.map(r => r[col]).filter(v => v !== '' && v != null))];
    sortFilterOptions(col, vals);
    const sel = document.createElement('select');
    const opt0 = document.createElement('option'); opt0.value = ''; opt0.textContent = col + '：全部';
    sel.appendChild(opt0);
    vals.forEach(v => { const o = document.createElement('option'); o.value = String(v); o.textContent = String(v); sel.appendChild(o); });
    sel.addEventListener('change', () => { state.filter[col] = sel.value; state.page = 1; apply(); });
    box.appendChild(sel);
  });
  const dayBox = document.createElement('span');
  dayBox.innerHTML = '<label>发布天数 <input type="number" id="daysMin" style="width:70px" placeholder="最小"><input type="number" id="daysMax" style="width:70px" placeholder="最大"></label>';
  box.appendChild(dayBox);
  document.getElementById('daysMin').addEventListener('input', e => { state.daysMin = e.target.value; state.page = 1; apply(); });
  document.getElementById('daysMax').addEventListener('input', e => { state.daysMax = e.target.value; state.page = 1; apply(); });
}

function clearAllFilters() {
  state.search = ''; state.filter = {}; state.daysMin = ''; state.daysMax = ''; state.page = 1;
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('#filters select').forEach(s => s.value = '');
  document.getElementById('daysMin').value = '';
  document.getElementById('daysMax').value = '';
  apply();
}

function renderTags() {
  const box = document.getElementById('filterTags');
  box.innerHTML = '';
  const tags = [];
  if (state.search) tags.push({ label: '搜索：“' + state.search + '”', clear: () => { state.search=''; document.getElementById('searchInput').value=''; } });
  for (const col of FILTER_COLS) {
    if (state.filter[col]) tags.push({ label: col + '：' + state.filter[col], clear: () => { state.filter[col]=''; const el=[...document.querySelectorAll('#filters select')].find(s=>s.options[0].textContent.startsWith(col)); if(el) el.value=''; } });
  }
  if (state.daysMin !== '' || state.daysMax !== '') {
    const lbl = '发布天数：' + (state.daysMin===''?'':state.daysMin) + ' ~ ' + (state.daysMax===''?'':state.daysMax);
    tags.push({ label: lbl, clear: () => { state.daysMin=''; state.daysMax=''; document.getElementById('daysMin').value=''; document.getElementById('daysMax').value=''; } });
  }
  tags.forEach(t => {
    const span = document.createElement('span'); span.className = 'tag';
    span.innerHTML = '<span>' + esc(t.label) + '</span><button title="移除">×</button>';
    span.querySelector('button').addEventListener('click', () => { t.clear(); state.page = 1; apply(); });
    box.appendChild(span);
  });
  const all = document.createElement('span');
  all.className = 'tag clear-all' + (tags.length ? '' : ' disabled');
  all.innerHTML = '✕ 清除全部筛选';
  all.addEventListener('click', () => { if (tags.length) clearAllFilters(); });
  box.appendChild(all);
}

function render() {
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / state.per));
  state.page = Math.min(state.page, pages);
  const start = (state.page - 1) * state.per;
  const rows = filtered.slice(start, start + state.per);

  document.getElementById('totalCount').textContent = total.toLocaleString('zh-CN');
  document.getElementById('pageInfo').textContent = state.page + ' / ' + pages;
  document.getElementById('prevBtn').disabled = state.page <= 1;
  document.getElementById('nextBtn').disabled = state.page >= pages;

  const thead = document.getElementById('thead');
  thead.innerHTML = '<tr>' + DISPLAY_COLS.map(c => {
    let arr = '';
    if (state.sortCol === c) arr = state.sortDir === 1 ? '↑' : '↓';
    else if (!state.sortCol && c === '课程') arr = '↑';
    return '<th data-col="' + c + '">' + esc(c) + '<span class="arr">' + arr + '</span></th>';
  }).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => {
      const c = th.getAttribute('data-col');
      if (state.sortCol === c) {
        if (state.sortDir === 1) state.sortDir = -1;
        else { state.sortCol = null; state.sortDir = 1; }
      } else { state.sortCol = c; state.sortDir = 1; }
      state.page = 1; render();
    });
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(r => '<tr>' + DISPLAY_COLS.map(c => {
    const v = r[c];
    if (c === '资源id') {
      const href = r['链接'] || '';
      return '<td class="num"><a href="' + esc(href) + '" target="_blank" rel="noopener" style="color:var(--blue)">' + esc(v) + '</a></td>';
    }
    const cls = NUM_COLS.has(c) ? 'num' : '';
    const text = (v === '' || v == null) ? '' : esc(v);
    return '<td class="' + cls + '">' + text + '</td>';
  }).join('') + '</tr>').join('');
}

function done() {
  document.getElementById('loading').style.display = 'none';
  const tbl = document.getElementById('detailTable'); tbl.style.display = '';
  document.getElementById('exportBtn').style.display = '';
  buildFilterOptions();
  apply();
}
function loadData() {
  const loading = document.getElementById('loading');
  if (window.Worker) {
    try {
      const w = new Worker('worker.js');
      w.onmessage = e => {
        const m = e.data;
        if (m.type === 'progress') {
          loading.textContent = '数据解密中 ' + Math.round(m.done / m.total * 100) + '%…';
        } else if (m.type === 'batch') {
          allDetail.push.apply(allDetail, m.data);
        } else if (m.type === 'done') {
          w.terminate();
          done();
        } else if (m.type === 'error') {
          w.terminate();
          loading.textContent = 'Worker 加载失败，改用主线程…';
          fallbackLoad();
        }
      };
      return;
    } catch (e) { /* 走主线程降级 */ }
  }
  fallbackLoad();
}
function fallbackLoad() {
  const loading = document.getElementById('loading');
  loading.textContent = '数据加载中…';
  fetch('detail.json?v=' + Date.now()).then(r => r.json()).then(det => {
    allDetail = [];
    const step = 400;
    function batch(i) {
      const end = Math.min(i + step, det.length);
      for (; i < end; i++) {
        const r = det[i]; const c = Object.assign({}, r);
        SENS_FIELDS.forEach(k => { if (c[k]) c[k] = decSens(c[k]); });
        allDetail.push(c);
      }
      loading.textContent = '数据解密中 ' + Math.round(end / det.length * 100) + '%…';
      if (end < det.length) { setTimeout(() => batch(end), 0); }
      else { done(); }
    }
    batch(0);
  }).catch(e => { loading.textContent = '加载失败：' + e.message; });
}

document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value.trim(); state.page = 1; apply(); });
document.getElementById('prevBtn').addEventListener('click', () => { if (state.page > 1) { state.page--; render(); } });
document.getElementById('nextBtn').addEventListener('click', () => { if (state.page < Math.ceil(filtered.length / state.per)) { state.page++; render(); } });
document.getElementById('perPage').addEventListener('change', e => { state.per = Number(e.target.value); state.page = 1; render(); });

// ===== 导出 Excel（复用格式：发布天数在审核人前 + 排序）=====
const EXPORT_WIDTHS = [11, 8, 44.5, 12.875, 11.125, 12.25, 6.875, 11.25, 9, 8.625, 9, 8.625, 14.625, 11.25, 10.75, 6.625, 6.875, 6.75, null, null, 10.375, null, null, null, null, null, 11];
document.getElementById('exportBtn').addEventListener('click', () => {
  const rows = filtered.slice();
  const btn = document.getElementById('exportBtn');
  btn.textContent = '⏳ 生成中…'; btn.disabled = true;
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('发布15天0下载明细');
  ws.views = [{ state: 'frozen', xSplit: 8, ySplit: 1 }];
  COLS.forEach((h, i) => {
    const c = ws.getCell(1, i + 1);
    c.value = h;
    c.font = { name: '微软雅黑', size: 10, bold: true };
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };
    c.alignment = { horizontal: 'left', vertical: 'center' };
  });
  ws.getRow(1).height = 16.5;
  EXPORT_WIDTHS.forEach((w, i) => { if (w) ws.getColumn(i + 1).width = w; });
  const font = { name: '微软雅黑', size: 10 };
  rows.forEach((r, idx) => {
    const row = ws.getRow(idx + 2);
    COLS.forEach((h, i) => {
      const c = row.getCell(i + 1);
      const v = r[h];
      c.value = (v === '' || v == null) ? '' : v;
      c.font = font;
    });
  });
  ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: rows.length + 1, column: COLS.length } };
  wb.xlsx.writeBuffer().then(buf => {
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '发布15天0下载明细_' + new Date().toISOString().split('T')[0] + '_' + rows.length + '条.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    btn.textContent = '⬇ 导出 Excel'; btn.disabled = false;
  }).catch(e => { btn.textContent = '⬇ 导出 Excel'; btn.disabled = false; alert('导出失败：' + e.message); });
});
</script>
